<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新标签页</title>
    <link rel="icon" sizes="16x16" href="icons/icon-16.png">
    <link rel="icon" sizes="48x48" href="icons/icon-48.png">
    <link rel="icon" sizes="128x128" href="icons/icon-128.png">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- Background Layer -->
    <div class="background-layer" id="backgroundLayer"></div>

    <!-- Reusable optical filters. Chrome can apply SVG filters to the backdrop itself. -->
    <svg class="liquid-filter-defs" width="0" height="0" aria-hidden="true" focusable="false">
        <defs>
            <filter id="liquidGlassRefraction" x="-12%" y="-12%" width="124%" height="124%"
                color-interpolation-filters="sRGB">
                <feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="2" seed="8"
                    result="liquidMap" />
                <feGaussianBlur in="liquidMap" stdDeviation="2.2" result="softMap" />
                <feDisplacementMap in="SourceGraphic" in2="softMap" scale="14" xChannelSelector="R"
                    yChannelSelector="G" result="refracted" />
                <feColorMatrix in="refracted" type="saturate" values="1.16" />
            </filter>
            <filter id="liquidGlassCompact" x="-10%" y="-10%" width="120%" height="120%"
                color-interpolation-filters="sRGB">
                <feTurbulence type="fractalNoise" baseFrequency="0.014 0.018" numOctaves="1" seed="14"
                    result="compactMap" />
                <feGaussianBlur in="compactMap" stdDeviation="1.4" result="compactSoftMap" />
                <feDisplacementMap in="SourceGraphic" in2="compactSoftMap" scale="8" xChannelSelector="R"
                    yChannelSelector="G" result="compactRefracted" />
                <feColorMatrix in="compactRefracted" type="saturate" values="1.12" />
            </filter>
            <filter id="liquidGlassLens" x="-28%" y="-28%" width="156%" height="156%"
                color-interpolation-filters="sRGB">
                <feTurbulence type="fractalNoise" baseFrequency="0.01 0.016" numOctaves="2" seed="23"
                    result="lensMap" />
                <feGaussianBlur in="lensMap" stdDeviation="1.8" result="lensSoftMap" />
                <feDisplacementMap in="SourceGraphic" in2="lensSoftMap" scale="28" xChannelSelector="R"
                    yChannelSelector="G" result="lensBent" />
                <feGaussianBlur in="lensBent" stdDeviation="0.22" result="lensSoftened" />
                <feDisplacementMap in="lensSoftened" in2="lensSoftMap" scale="11" xChannelSelector="G"
                    yChannelSelector="R" result="lensRefracted" />
                <feColorMatrix in="lensRefracted" type="saturate" values="1.35" />
            </filter>
        </defs>
    </svg>

    <!-- Settings Button -->
    <button class="settings-btn" id="settingsBtn" title="设置">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 6h10M18 6h2M4 12h2M10 12h10M4 18h7M15 18h5"></path>
            <circle cx="16" cy="6" r="2"></circle>
            <circle cx="8" cy="12" r="2"></circle>
            <circle cx="13" cy="18" r="2"></circle>
        </svg>
    </button>

    <div class="container">
        <!-- Header with Time and Status -->
        <header class="header compact">
            <div class="time-block">
                <div class="time" id="time">12:00</div>
                <div class="date" id="date">2025年12月2日</div>
            </div>

            <div class="status-strip">
                <div class="status-card wide" id="activityStatus">
                    <div class="status-title">活动</div>
                    <div class="status-body activity-body">
                        <button class="status-pill soft clickable" id="mediaActivity" type="button">无媒体播放</button>
                        <button class="status-pill soft clickable" id="downloadActivity" type="button">无下载</button>
                    </div>
                </div>
                <div class="status-card" id="systemStatus">
                    <div class="status-title">系统</div>
                    <div class="status-body activity-body">
                        <div class="status-pill soft" id="cpuInfo">CPU: --</div>
                        <div class="status-pill soft" id="memoryInfo">内存: --</div>
                        <div class="status-pill soft clickable" id="batteryInfo">电池: --</div>
                    </div>
                </div>
            </div>
        </header>

        <!-- Search Widget -->
        <div class="search-widget" id="searchWidget">
            <div class="search-container">
                <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.35-4.35"></path>
                </svg>
                <input type="text" id="searchInput" placeholder="搜索网络..." class="search-input" list="searchSuggestions">
                <div class="search-engine-badge" id="searchEngineBadge">Google</div>
            </div>
            <datalist id="searchSuggestions"></datalist>
        </div>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Bookmarks Section -->
            <div class="bookmarks-section">
                <div class="bookmarks-header">
                    <div class="folder-state">
                        <p class="eyebrow">当前文件夹</p>
                        <h3 id="currentFolderLabel">全部</h3>
                    </div>
                    <div class="header-actions">
                        <button class="ghost-btn" id="animeWallpaperBtn">换张二次元壁纸</button>
                        <button class="ghost-btn primary" id="addFolderBtn">新建文件夹</button>
                    </div>
                </div>

                <div class="bookmarks-grid" id="bookmarksGrid">
                    <!-- Bookmarks will be added here -->
                </div>

                <!-- Add Bookmark Button -->
                <button class="add-bookmark-btn" id="addBtn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </button>
            </div>

            <!-- Recent Sites -->
            <section class="recent-section">
                <div class="recent-header">
                    <div>
                        <p class="eyebrow">常访问</p>
                        <h3>最近常访问的网站</h3>
                    </div>
                    <div class="recent-actions">
                        <button class="ghost-btn" id="refreshRecentBtn">刷新</button>
                    </div>
                </div>
                <div class="recent-scroller" id="recentScroller">
                    <div class="recent-track" id="recentTrack">
                        <!-- Recent cards -->
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Add Bookmark Modal -->
    <div class="modal" id="addModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>添加书签</h2>
                <button class="close-btn" id="closeBtn">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="urlInput">网址</label>
                    <input type="url" id="urlInput" placeholder="https://example.com" required>
                </div>
                <div class="form-group">
                    <label for="nameInput">名称（可选）</label>
                    <input type="text" id="nameInput" placeholder="将自动获取网页标题">
                </div>
                <div class="form-group">
                    <label for="folderSelect">文件夹</label>
                    <select id="folderSelect" class="folder-select">
                        <option value="全部">全部</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="iconInput">图标地址（可选）</label>
                    <input type="url" id="iconInput" placeholder="https://example.com/favicon.ico">
                </div>
                <div class="preview" id="preview" style="display: none;">
                    <img id="previewIcon" src="" alt="图标预览">
                    <span id="previewName"></span>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="cancelBtn">取消</button>
                <button class="btn btn-primary" id="saveBtn">保存</button>
            </div>
        </div>
    </div>

    <!-- Settings Panel -->
    <div class="settings-panel" id="settingsPanel">
        <div class="settings-content">
            <div class="settings-header">
                <h2>设置</h2>
                <button class="close-settings-btn" id="closeSettingsBtn">&times;</button>
            </div>

            <div class="settings-body">
                <!-- Settings Tabs -->
                <div class="settings-tabs">
                    <button class="tab-btn active" data-tab="appearance">外观</button>
                    <button class="tab-btn" data-tab="wallpaper">壁纸</button>
                    <button class="tab-btn" data-tab="layout">布局</button>
                    <button class="tab-btn" data-tab="data">数据</button>
                </div>

                <!-- Tab Contents -->
                <div class="settings-tab-content">
                    <!-- Appearance Tab -->
                    <div class="tab-pane active" id="appearanceTab">
                        <div class="setting-item">
                            <label>时钟格式</label>
                            <select id="clockFormatSelect" class="setting-select">
                                <option value="24h">24小时制</option>
                                <option value="12h">12小时制</option>
                            </select>
                        </div>
                        <div class="setting-item">
                            <label>搜索引擎</label>
                            <select id="searchEngineSelect" class="setting-select">
                                <option value="google">Google</option>
                                <option value="bing">Bing</option>
                                <option value="baidu">百度</option>
                                <option value="duckduckgo">DuckDuckGo</option>
                            </select>
                        </div>
                        <div class="setting-item">
                            <label class="toggle-label">
                                <span>增强动画</span>
                                <input type="checkbox" id="enhancedAnimationsToggle" class="toggle-input" checked>
                                <span class="toggle-slider"></span>
                            </label>
                        </div>
                        <div class="setting-item">
                            <label class="toggle-label">
                                <span>白天模式</span>
                                <input type="checkbox" id="themeToggle" class="toggle-input">
                                <span class="toggle-slider"></span>
                            </label>
                        </div>
                    </div>

                    <!-- Wallpaper Tab -->
                    <div class="tab-pane" id="wallpaperTab">
                        <div class="wallpaper-controls">
                            <button class="wallpaper-btn" id="randomWallpaperBtn">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                                    <polyline points="21 15 16 10 5 21"></polyline>
                                </svg>
                                二次元随机壁纸
                            </button>
                            <label class="wallpaper-btn upload-btn">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                    <polyline points="17 8 12 3 7 8"></polyline>
                                    <line x1="12" y1="3" x2="12" y2="15"></line>
                                </svg>
                                上传本地图片/视频
                                <input type="file" id="wallpaperUpload" accept="image/*,video/*" style="display: none;">
                            </label>
                            <button class="wallpaper-btn" id="resetWallpaperBtn">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                                    <path d="M3 3v5h5"></path>
                                </svg>
                                重置默认
                            </button>
                        </div>
                        <div class="setting-item">
                            <label>模糊度: <span id="blurValue">0</span>px</label>
                            <input type="range" id="blurSlider" min="0" max="10" value="0" class="setting-slider">
                        </div>
                        <div class="setting-item">
                            <label>暗度: <span id="overlayValue">30</span>%</label>
                            <input type="range" id="overlaySlider" min="0" max="80" value="30" class="setting-slider">
                        </div>
                    </div>

                    <!-- Layout Tab -->
                    <div class="tab-pane" id="layoutTab">
                        <div class="setting-item">
                            <label class="toggle-label">
                                <span>显示时钟</span>
                                <input type="checkbox" id="showClockToggle" class="toggle-input" checked>
                                <span class="toggle-slider"></span>
                            </label>
                        </div>
                        <div class="setting-item">
                            <label class="toggle-label">
                                <span>显示搜索框</span>
                                <input type="checkbox" id="showSearchToggle" class="toggle-input" checked>
                                <span class="toggle-slider"></span>
                            </label>
                        </div>
                        <div class="setting-item">
                            <label class="toggle-label">
                                <span>显示书签</span>
                                <input type="checkbox" id="showBookmarksToggle" class="toggle-input" checked>
                                <span class="toggle-slider"></span>
                            </label>
                        </div>
                        <div class="setting-item">
                            <label class="toggle-label">
                                <span>显示状态概览</span>
                                <input type="checkbox" id="showStatusToggle" class="toggle-input" checked>
                                <span class="toggle-slider"></span>
                            </label>
                        </div>
                        <div class="setting-item">
                            <label class="toggle-label">
                                <span>显示最近常访问</span>
                                <input type="checkbox" id="showRecentToggle" class="toggle-input" checked>
                                <span class="toggle-slider"></span>
                            </label>
                        </div>
                    </div>

                    <!-- Data Tab -->
                    <div class="tab-pane" id="dataTab">
                        <div class="data-controls">
                            <button class="data-btn export-btn" id="exportBtn">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                    <polyline points="7 10 12 15 17 10"></polyline>
                                    <line x1="12" y1="15" x2="12" y2="3"></line>
                                </svg>
                                导出数据
                            </button>
                            <label class="data-btn import-btn">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                    <polyline points="17 8 12 3 7 8"></polyline>
                                    <line x1="12" y1="3" x2="12" y2="15"></line>
                                </svg>
                                导入数据
                                <input type="file" id="importInput" accept=".json" style="display: none;">
                            </label>
                            <button class="data-btn reset-btn" id="resetBtn">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                                    <path d="M3 3v5h5"></path>
                                </svg>
                                重置所有设置
                            </button>
                        </div>
                        <div class="data-info">
                            <p>💡 导出会将书签、设置和本地壁纸保存为JSON文件</p>
                            <p>⚠️ 导入数据会覆盖当前所有设置</p>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Script Imports -->
    <script src="modules/settings.js"></script>
    <script src="modules/wallpaper.js"></script>
    <script src="modules/bookmarks.js"></script>
    <script src="modules/search.js"></script>
    <script src="modules/import-export.js"></script>
    <script src="script.js"></script>
</body>

</html>
